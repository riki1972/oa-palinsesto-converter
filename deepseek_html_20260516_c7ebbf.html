<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 Palinsesto Sport – Domenica 17 Maggio 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #1a2c3e;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #0f2b3d 0%, #1b4f6e 100%);
            color: white;
            padding: 20px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 small {
            font-size: 0.9rem;
            font-weight: normal;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 30px;
        }

        .header p {
            margin-top: 10px;
            opacity: 0.85;
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            background: white;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            align-items: center;
        }

        .filter-btn {
            background: #e9ecef;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #2c5a7a;
        }

        .filter-btn.active {
            background: #1b6b8f;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .filter-btn:hover {
            background: #cbdde6;
            transform: scale(0.96);
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .event-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            padding: 14px 20px;
            transition: all 0.2s;
            border-left: 5px solid #2c7da0;
            gap: 10px;
        }

        .event-card.live-now {
            background: #fffae6;
            border-left-color: #e6a017;
            box-shadow: 0 4px 12px rgba(230,160,23,0.15);
        }

        .time-block {
            min-width: 95px;
            font-weight: 800;
            font-size: 1rem;
            color: #1e4663;
            background: #eef2f7;
            padding: 5px 10px;
            border-radius: 30px;
            text-align: center;
            font-family: monospace;
        }

        .time-note {
            font-size: 0.65rem;
            font-weight: normal;
            color: #e67e22;
            display: block;
        }

        .sport-cat {
            min-width: 100px;
            font-weight: 600;
            background: #eef2f5;
            padding: 4px 10px;
            border-radius: 30px;
            text-align: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2c5a7a;
        }

        .event-title {
            flex: 3;
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .channels {
            flex: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .channel-badge {
            background: #f4f6f9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .streaming-badge {
            background: #e8f0fe;
            color: #1b6b8f;
        }

        @media (max-width: 850px) {
            .event-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .time-block, .sport-cat, .event-title, .channels {
                width: 100%;
            }
            .filters {
                border-radius: 20px;
                justify-content: center;
            }
        }

        footer {
            margin-top: 35px;
            text-align: center;
            font-size: 0.7rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>
            📺 Sport in TV e Streaming
            <small>Domenica 17 Maggio 2026</small>
        </h1>
        <p>🗓️ Palinsesto completo – clicca sui filtri per categoria. In giallo gli eventi in corso.</p>
    </div>

    <div class="filters" id="filterBar">
        <button class="filter-btn active" data-cat="all">🏁 Tutti</button>
        <button class="filter-btn" data-cat="Ciclismo">🚴 Ciclismo</button>
        <button class="filter-btn" data-cat="Tennis">🎾 Tennis</button>
        <button class="filter-btn" data-cat="Motori">🏎️ Motori</button>
        <button class="filter-btn" data-cat="Calcio">⚽ Calcio</button>
        <button class="filter-btn" data-cat="Altro">🏀 Altri sport</button>
    </div>

    <div class="timeline" id="timelineContainer"></div>
    <footer>Fonte: Virgilio Sport – Guida TV. Gli orari sono italiani.</footer>
</div>

<script>
    // Palinsesto del 17 maggio 2026 (basato su sport.virgilio.it)
    const events = [
        // Atletica
        { time: "08:00", sport: "Atletica", title: "World Athletics Continental Tour Gold – Tokyo", channels: ["🔵 Sky Sport Arena"], category: "Altro" },
        // Moto3
        { time: "11:00", sport: "Moto3", title: "GP Catalunya", channels: ["🔵 Sky Sport MotoGP", "🔵 Sky Sport 1"], category: "Motori" },
        // Superbike
        { time: "11:10", sport: "Superbike", title: "GP Repubblica Ceca", channels: ["🔵 Sky Sport Arena"], category: "Motori" },
        // Calcio (ore 12:00, partite multiple)
        { time: "12:00", sport: "Calcio", title: "Serie A – Como vs Parma", channels: ["🔵 Sky", "🎯 DAZN"], category: "Calcio" },
        { time: "12:00", sport: "Calcio", title: "Serie A – Genoa vs Milan", channels: ["🎯 DAZN"], category: "Calcio" },
        { time: "12:00", sport: "Calcio", title: "Serie A – Juventus vs Fiorentina", channels: ["🔵 Sky", "🎯 DAZN", "🔵 Sky Sport Calcio"], category: "Calcio" },
        { time: "12:00", sport: "Calcio", title: "Serie A – Pisa vs Napoli", channels: ["🎯 DAZN"], category: "Calcio" },
        { time: "12:00", sport: "Calcio", title: "Serie A – Roma vs Lazio", channels: ["🎯 DAZN"], category: "Calcio" },
        // Tennis WTA Finale Doppio
        { time: "12:00", sport: "Tennis", title: "WTA 1000 Roma – Finale Doppio", channels: ["🔵 Sky Sport Tennis"], category: "Tennis" },
        // Moto2
        { time: "12:15", sport: "Moto2", title: "GP Catalunya", channels: ["🔵 Sky Sport MotoGP", "🔵 Sky Sport 1"], category: "Motori" },
        // Ciclismo Giro (Eurosport)
        { time: "12:30", sport: "Ciclismo", title: "Giro d’Italia – 9ª tappa: Cervia-Corno alle Scale", channels: ["📡 Eurosport"], streaming: ["🟢 Discovery+", "🟣 HBO Max"], category: "Ciclismo" },
        // Rugby femminile
        { time: "13:15", sport: "Rugby", title: "Sei Nazioni femminile – Galles vs Italia", channels: ["🔵 Sky Sport Max"], category: "Altro" },
        // Ciclismo Giro (Rai 2)
        { time: "14:00", sport: "Ciclismo", title: "Giro d’Italia – 9ª tappa: Cervia-Corno alle Scale", channels: ["📺 Rai 2"], streaming: ["📱 Rai Play"], category: "Ciclismo" },
        // MotoGP
        { time: "14:00", sport: "MotoGP", title: "GP Catalunya", channels: ["🔵 Sky Sport MotoGP", "🔵 Sky Sport 1"], category: "Motori" },
        // Tennis ATP Finale Doppio
        { time: "14:00", sport: "Tennis", title: "ATP 1000 Roma – Finale Doppio", channels: ["🔵 Sky Sport Tennis"], category: "Tennis" },
        // Calcio Inter-Verona
        { time: "15:00", sport: "Calcio", title: "Serie A – Inter vs Verona", channels: ["🎯 DAZN"], category: "Calcio" },
        // Superbike gara 2
        { time: "15:30", sport: "Superbike", title: "GP Repubblica Ceca (Gara 2)", channels: ["🔵 Sky Sport 1", "📺 Cielo", "🔵 Sky Sport Arena"], category: "Motori" },
        // Rugby Irlanda-Scozia
        { time: "15:30", sport: "Rugby", title: "Sei Nazioni femminile – Irlanda vs Scozia", channels: ["🔵 Sky Sport Mix"], category: "Altro" },
        // Diretta Gol Premier League
        { time: "16:00", sport: "Calcio", title: "Diretta Gol Premier League", channels: ["🔵 Sky Sport Calcio"], category: "Calcio" },
        // Pallavolo finale 3°/4° posto
        { time: "17:00", sport: "Pallavolo", title: "CEV Champions League maschile – Finale 3°/4° posto", channels: ["🔵 Sky Sport Arena"], category: "Altro" },
        // Tennis ATP Finale Singolare
        { time: "17:00", sport: "Tennis", title: "ATP 1000 Roma – Finale Singolare", channels: ["🔵 Sky Sport 1", "🔵 Sky Sport Tennis", "📺 TV8"], streaming: ["▶️ NOW", "☁️ Sky Go"], category: "Tennis" },
        // Rugby Francia-Inghilterra
        { time: "17:45", sport: "Rugby", title: "Sei Nazioni femminile – Francia vs Inghilterra", channels: ["🔵 Sky Sport Max"], category: "Altro" },
        // Calcio Atalanta-Bologna
        { time: "18:00", sport: "Calcio", title: "Serie A – Atalanta vs Bologna", channels: ["🎯 DAZN"], category: "Calcio" },
        // Pallamano Italia-Svizzera
        { time: "18:00", sport: "Pallamano", title: "Qualificazioni Mondiali 2027 – Italia vs Svizzera", channels: ["🔵 Sky Sport Mix"], category: "Altro" },
        // Premier League Newcastle-West Ham
        { time: "18:30", sport: "Calcio", title: "Premier League – Newcastle vs West Ham", channels: ["🔵 Sky Sport Calcio"], category: "Calcio" },
        // Basket Venezia-Tortona
        { time: "20:00", sport: "Basket", title: "Serie A – Venezia vs Tortona", channels: ["🔵 Sky Sport Basket"], category: "Altro" },
        // Pallavolo finale CEV
        { time: "20:30", sport: "Pallavolo", title: "CEV Champions League maschile – Finale", channels: ["🔵 Sky Sport 1", "🔵 Sky Sport Arena"], category: "Altro" },
        // Calcio Cagliari-Torino
        { time: "20:45", sport: "Calcio", title: "Serie A – Cagliari vs Torino", channels: ["🎯 DAZN"], category: "Calcio" },
        // Calcio Sassuolo-Lecce
        { time: "20:45", sport: "Calcio", title: "Serie A – Sassuolo vs Lecce", channels: ["🔵 Sky", "🎯 DAZN", "🔵 Sky Sport Calcio"], category: "Calcio" },
        // Calcio Udinese-Cremonese
        { time: "20:45", sport: "Calcio", title: "Serie A – Udinese vs Cremonese", channels: ["🎯 DAZN"], category: "Calcio" },
        // Rugby Top 14
        { time: "21:05", sport: "Rugby", title: "Top 14 – Stade Rochelais vs Tolosa", channels: ["🔵 Sky Sport Max"], category: "Altro" }
    ];

    // Funzione per mostrare/ordinare/filtrare gli eventi
    function renderTimeline(filterCategory = "all") {
        const container = document.getElementById('timelineContainer');
        if (!container) return;
        container.innerHTML = '';

        const now = new Date();
        const currentHoursMinutes = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        const filtered = events.filter(ev => {
            if (filterCategory === "all") return true;
            if (filterCategory === "Motori") return ev.category === "Motori";
            if (filterCategory === "Altro") return ev.category === "Altro";
            return ev.category === filterCategory;
        });

        filtered.sort((a,b) => a.time.localeCompare(b.time));

        filtered.forEach(ev => {
            let isLive = false;
            const evTimeMinutes = parseInt(ev.time.split(':')[0])*60 + parseInt(ev.time.split(':')[1]);
            const currentMinutes = parseInt(currentHoursMinutes.split(':')[0])*60 + parseInt(currentHoursMinutes.split(':')[1]);
            if (evTimeMinutes <= currentMinutes && currentMinutes < (evTimeMinutes + 120)) {
                isLive = true;
            }

            const card = document.createElement('div');
            card.className = `event-card${isLive ? ' live-now' : ''}`;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'time-block';
            timeDiv.innerHTML = ev.time;

            const sportDiv = document.createElement('div');
            sportDiv.className = 'sport-cat';
            sportDiv.innerText = ev.sport;

            const titleDiv = document.createElement('div');
            titleDiv.className = 'event-title';
            titleDiv.innerHTML = ev.title;

            const channelsDiv = document.createElement('div');
            channelsDiv.className = 'channels';

            if (ev.channels && ev.channels.length) {
                ev.channels.forEach(ch => {
                    const badge = document.createElement('span');
                    badge.className = 'channel-badge';
                    badge.innerHTML = ch;
                    channelsDiv.appendChild(badge);
                });
            }
            if (ev.streaming && ev.streaming.length) {
                ev.streaming.forEach(stream => {
                    const badge = document.createElement('span');
                    badge.className = 'channel-badge streaming-badge';
                    badge.innerHTML = stream;
                    channelsDiv.appendChild(badge);
                });
            }

            card.appendChild(timeDiv);
            card.appendChild(sportDiv);
            card.appendChild(titleDiv);
            card.appendChild(channelsDiv);
            container.appendChild(card);
        });

        if (filtered.length === 0) {
            container.innerHTML = '<div style="background: white; border-radius: 20px; padding: 40px; text-align: center;">Nessun evento per questa categoria. Prova un altro filtro 🎯</div>';
        }
    }

    // Pulsanti filtro
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const cat = btn.getAttribute('data-cat');
            renderTimeline(cat);
        });
    });

    renderTimeline('all');
</script>
</body>
</html>
